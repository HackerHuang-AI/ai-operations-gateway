server.port=8890
app.environment=stag
app.debug=false

# ==================== 日志配置 ====================
logging.file.path=logs
logging.level.root=INFO
logging.level.com.ai.operations.gateway=INFO

# ==================== Nacos 配置中心 ====================
# 部署平台在启动前注入 Nacos 凭据；未注入时使用本地 stag 账号，便于本地调试。
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.config.namespace=stag
spring.cloud.nacos.config.username=${SPRING_CLOUD_NACOS_CONFIG_USERNAME:ai-operations-gateway-stag}
spring.cloud.nacos.config.password=${SPRING_CLOUD_NACOS_CONFIG_PASSWORD:ai-operations-gateway-local123-stag}
spring.cloud.nacos.config.import-check.enabled=false

# ==================== Nacos 服务注册与发现 ====================
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.namespace=${spring.cloud.nacos.config.namespace}
spring.cloud.nacos.discovery.username=${SPRING_CLOUD_NACOS_DISCOVERY_USERNAME:ai-operations-gateway-stag}
spring.cloud.nacos.discovery.password=${SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD:ai-operations-gateway-local123-stag}

# ==================== Vault ====================
# Nacos 使用启动前注入的同一套应用凭据加载基础配置，随后 Vault 补充运行期密钥。
spring.config.import=optional:nacos:ai-operations-gateway.properties?group=ai-operations-gateway,optional:vault://
spring.cloud.vault.enabled=true
spring.cloud.vault.host=127.0.0.1
spring.cloud.vault.port=8200
spring.cloud.vault.scheme=http
spring.cloud.vault.authentication=APPROLE
# 部署平台注入当前应用的 Vault AppRole 凭据。
spring.cloud.vault.app-role.role-id=${VAULT_ROLE_ID}
spring.cloud.vault.app-role.secret-id=${VAULT_SECRET_ID}
spring.cloud.vault.app-role.app-role-path=approle
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.default-context=
spring.cloud.vault.kv.application-name=${spring.application.name}/${spring.profiles.active}
spring.cloud.vault.kv.profiles=

# ==================== Reactive Redis Cluster（凭据由 Vault 注入）====================
spring.data.redis.cluster.nodes=127.0.0.1:7001,127.0.0.1:7002,127.0.0.1:7003
spring.data.redis.lettuce.cluster.refresh.adaptive=true
spring.cache.redis.key-prefix=ai-admin:ai-operations-gateway:
spring.cache.redis.use-key-prefix=true

# Gateway 为 WebFlux 服务，不接入业务 MySQL 数据源。

