# 网关应用名称，同时作为 Nacos 服务标识
spring.application.name=ai-operations-gateway

# 由 Maven profile 在打包时注入运行环境
spring.profiles.active=@spring.profiles.active@

# ==================== Nacos 公共配置 ====================
# 环境文件通过 Nacos 与 Vault 导入配置。
spring.cloud.nacos.config.enabled=true
spring.cloud.nacos.config.import-check.enabled=false
# 配置中心：配置按应用名分组隔离。
spring.cloud.nacos.config.group=${spring.application.name}
spring.cloud.nacos.config.file-extension=properties
nacos.index-data-id=ai-operations-gateway-index.properties
# 服务注册与发现：所有 HTTP 服务共用 ai-admin 分组。
spring.cloud.nacos.discovery.enabled=true
spring.cloud.nacos.discovery.service=${spring.application.name}
spring.cloud.nacos.discovery.group=ai-admin

# ==================== i18n 国际化 ====================
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# 网关为 WebFlux + Reactive Redis，不接入业务 MySQL 数据源。

# ==================== Actuator ====================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.server.port=8891
management.server.address=127.0.0.1

