# Nacos 索引文件（DataId: ai-operations-gateway-index.properties，Group: ai-operations-gateway）
# 列出所有需要订阅的业务 DataId，NacosConfig 启动时读取此文件后自动订阅并缓存。
# 新增配置文件时：1) 在 NacosDataIdEnum 加枚举项  2) 在此追加一行  3) 在 Nacos 控制台创建对应 DataId。

# ==================== 网关治理配置 ====================
ai-operations-gateway-routes.json=动态路由与鉴权白名单配置
ai-operations-gateway-rate-limit.json=路由级 Redis 令牌桶限流配置
ai-operations-gateway-circuit-breaker.json=路由级 Resilience4j 熔断配置
ai-operations-gateway-downstream-headers.json=目标应用扩展请求头透传配置
ai-operations-gateway-call-chain.json=全局调用链跳数上限配置
